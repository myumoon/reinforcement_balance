# Survivors の自動下書きに使う固定矩形と下書き用検出器の設定。
#
# 毎フレーム同じ位置に置く矩形と、確認済みラベルで学習する小さな物体検出器の
# 学習・推論パラメータをまとめる。学習 CLI と下書き CLI の両方がこのファイルを読む。

schema_version: annotation_prelabel.v2

# 毎フレームに置く固定矩形（1920x1080 画面座標）。
fixed_boxes:
  - {label: player_anchor, bbox: [912, 466, 996, 540]}
  - {label: hud_hp, bbox: [924, 544, 996, 554]}
  - {label: hud_xp, bbox: [96, 0, 1824, 36]}

# 下書きから外す画面範囲（1920x1080 画面座標）。中心が bbox に入る labels の検出を書かない。
# 左上のアイテム欄（武器6枠＋パッシブ6枠のアイコン）は、斧・King Bible などのアイコンを
# 武器エフェクトと誤検出するため、weapon_* と weapon_target だけ外す（敵やジェムは本物が通るので外さない）。
ignore_regions:
  - {labels: [weapon_projectile, weapon_zone, weapon_orbit, weapon_aura, weapon_target], bbox: [96, 36, 390, 130]}

# 下書き用検出器（torchvision Faster R-CNN MobileNetV3）の学習・推論設定。
# labels の並びが検出器のクラス番号になるため、変えたら再学習が必要。
# 武器エフェクト4クラス（weapon_*）を追加したので、追加前の prelabel_detector.pt は
# 読み込み時にラベル不一致エラーになる。train_survivors_prelabel_detector.py で再学習すること。
detector:
  # weapon_target（照準の円）はアノテーション専用だが、手で付ける手間を減らすため下書きの対象にする。
  labels: [enemy_normal, enemy_elite, gem_blue, gem_green, gem_red, pickup_heal, pickup_special, weapon_projectile, weapon_zone, weapon_orbit, weapon_aura, weapon_target]
  label_aliases: {enemy_boss: enemy_normal}
  score_threshold: 0.5
  # ラベルごとに score_threshold を上書きする。weapon_target は見本が少ないうちは
  # 明るい／暗い楕円を誤検出するため高めにする（2026-10-09 に下書き40件を目視して決めた値。
  # 0.92 以上はほぼ照準、未満は大半が誤検出だった）。見本が増えたら見直す。
  label_score_thresholds: {weapon_target: 0.92}
  input_scale: 2
  crop_size: 480
  min_box_size: 6
  iterations: 1500
  batch_size: 4
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  seed: 0

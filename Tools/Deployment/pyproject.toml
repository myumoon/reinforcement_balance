# reinbalance-survivors-deployment パッケージのビルド設定(setuptools・依存・pytest 設定)。
#
# この Deployment ツール群を Python パッケージとして組み立てる方法を定義するファイルです。

[build-system]
# setuptools 70.2.0 は bdist_wheel を内蔵するため、別途（未 pin の）wheel 依存を持たない。
requires = ["setuptools==70.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reinbalance-survivors-deployment"
version = "0.1.0"
description = "Survivors deployment runtime (capture / perception / control). Consumes reinbalance-survivors-contracts."
requires-python = ">=3.11"
# 共有 contracts パッケージは、本パッケージより先に Tools/Common から editable で
# インストールする：`pip install -e Tools/Common`。onnxruntime・torch は
# 後続の deployment プランで追加する。opencv は review MP4 用に固定する。
dependencies = [
    "reinbalance-survivors-contracts==0.1.0",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "PyYAML==6.0.2",
    "dxcam==0.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["survivors*", "spikes*"]

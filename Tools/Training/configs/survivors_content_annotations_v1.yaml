# Combination coverage。複数 mechanics が同時に成立する境界を4種類固定する。
# 初心者向け: 単体テストだけでは見えない union、防御、即死耐性、boss 相互作用を確認します。
combinations:
  - {kind: pair_evolution_union, members: ["weapon:13", "weapon:14", "weapon:28"], scenario: vandalier_consumes_partner_slot, eval_assertion: one_vandalier_slot_and_one_empty_slot}
  - {kind: weak_defensive_weapon, members: ["weapon:15", "enemy:4"], scenario: laurel_shield_under_contact, eval_assertion: shield_absorbs_hit_and_observation_changes}
  - {kind: instant_kill_resistance, members: ["weapon:12", "enemy:10"], scenario: pentagram_against_resistant_boss, eval_assertion: boss_survives_instant_kill}
  - {kind: boss_interaction, members: ["enemy:10", "evolution:12:27"], scenario: gorgeous_moon_boss_chest, eval_assertion: boss_drop_and_evolution_are_observed}
# Starting-only exclusions。取得・effect・obs・eval の代替 coverage を必須にする。
# 初心者向け: 初期武器にできないことを、ゲーム全体から除外する意味にはしません。
intentional_exclusions:
  - {collection: weapons, id: "12", scope: starting_weapon, reason: instant-kill weapon cannot sustain starting XP, alternative_coverage: pentagram_acquisition_upgrade}
  - {collection: weapons, id: "15", scope: starting_weapon, reason: defensive weapon has no starting damage, alternative_coverage: laurel_acquisition_upgrade}
  - {collection: weapons, id: "27", scope: starting_weapon, reason: evolved weapon is acquired through evolution, alternative_coverage: gorgeous_moon_evolution}
